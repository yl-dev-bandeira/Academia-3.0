<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Fitness Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="img/WhatsApp Image 2024-11-20 at 11.17.59.jpeg" class="logo">
    </header>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="planos.html">Planos</a></li>
                <li><a href="cadastro.html">Matricule-se</a></li>
                <li><a href="fotos.html">Fotos</a></li>
            </ul>
        </nav>
    </header>
    <section class="cadastro">
        <center><h1>Cadastro</h1></center>
        <form action="cadastro.php" method="post">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="insira seu nome" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="insira sua senha" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="insira seu email" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="insira seu telefone" required>

            <label for="plano">Plano Escolhido:</label>
            <select id="plano" name="plano">
                <option value="basico">Plano Básico</option>
                <option value="premium">Plano Premium</option>
                <option value="vip">Plano VIP</option>
            </select>

            <button type="submit" id="submit" name="submit">Cadastrar</button>
        </form>
    </section>
    
    <footer>

    </footer>
</body>
</html>
